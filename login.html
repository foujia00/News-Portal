<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter Login - News Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ================= Breadcrumb Section ================= -->
    <section class="bg-white py-3 border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a href="index.html" class="text-decoration-none">Home</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <a href="about.html" class="text-decoration-none">About</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <a href="category.html" class="text-decoration-none">Category</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <a href="author.html" class="text-decoration-none">Author</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <a href="contact.html" class="text-decoration-none">Contact</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"> Login</li>
                </ol>
            </nav>
        </div>
    </section>


    <!-- ================= Login Page Header ================= -->
    <section class="py-5 bg-primary text-white text-center">
        <div class="container">
            <h1 class="fw-bold">Reporter Login</h1>
            <p class="mb-0">Access the reporter dashboard securely</p>
        </div>
    </section>


    <!-- ================= Login Form Section ================= -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-4">

                    <div class="card shadow border-0 rounded-4">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                    style="width: 70px; height: 70px;">
                                    <span class="fs-2 text-primary">🔐</span>
                                </div>
                                <h3 class="fw-bold mb-1">Login Account</h3>
                                <p class="text-muted mb-0">Enter your credentials to continue</p>
                            </div>
                            <form id="loginForm">
                                <!-- User Name -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">User Name</label>
                                    <input type="text" class="form-control form-control-lg"
                                        placeholder="Enter your user name">
                                </div>
                                <!-- Password -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control form-control-lg"
                                        placeholder="Enter your password">
                                </div>
                                <!-- Login Button -->
                                <div class="d-grid">
                                    <button   type="submit" class="btn btn-primary btn-lg">
                                        Login
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- ================= Footer ================= -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 News Portal. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
